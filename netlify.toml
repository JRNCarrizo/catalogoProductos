# Publicación en Netlify (gratis).
# Cada push a main dispara un deploy automático.
# Podés elegir el subdominio en: Site settings → Domain management
# (ej. vinosderemate.netlify.app)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# API del colector (APK → catálogo). Variables: COLECTOR_CLAVE, GITHUB_TOKEN
[[redirects]]
  from = "/api/colector-publicar"
  to = "/.netlify/functions/colector-publicar"
  status = 200

# SPA: todas las rutas caen en index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
